{% set name = "diffprivlib" %}
{% set version = "0.6.4" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/diffprivlib-{{ version }}.tar.gz
  sha256: 9a126078670a0663bd27778041905139c8023dbc22ef04f86e616b6bfd1cc138

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - joblib >=0.16.0
    - numpy >=1.19.0
    - python >={{ python_min }}
    - scikit-learn >=0.23.0
    - scipy >=1.5.0
    - setuptools >=49.0.0

test:
  imports:
    - diffprivlib
    - diffprivlib.mechanisms
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/IBM/differential-privacy-library
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: IBM Differential Privacy Library
  doc_url: https://pypi.org/project/diffprivlib/
  dev_url: https://github.com/IBM/differential-privacy-library

extra:
  recipe-maintainers:
    - mxr-conda
